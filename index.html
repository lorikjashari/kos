<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="theme-color" content="#0a1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KoS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>KoS — FPS Shooting</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        min-height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        overflow: hidden;
        background: #0a1220;
        color-scheme: dark;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }

      #fps {
        display: none;
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        left: max(64px, calc(env(safe-area-inset-left) + 58px));
        font-weight: 500;
        font-size: 13px;
        letter-spacing: 0.06em;
        font-family: 'Lucida Console', Consolas, monospace;
        color: #7cfc00;
        background: rgba(0, 0, 0, 0.45);
        padding: 4px 8px;
        z-index: 6;
        pointer-events: none;
      }
      @media (pointer: coarse) {
        #fps { display: none !important; }
      }

      /* Only the WebGL view — never the crosshair / settings preview */
      #kos-gl {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        touch-action: none;
        background: #0a1220;
        z-index: 0;
        /* iOS treats a canvas like an image on long press without this */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #game-crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 48px;
        height: 48px;
        transform: translate(-50%, -50%);
        z-index: 25;
        pointer-events: none;
        background: transparent;
        opacity: 0;
        visibility: hidden;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #game-crosshair.is-on {
        opacity: 1;
        visibility: visible;
      }
      #game-crosshair.is-awp-hidden {
        opacity: 0 !important;
        visibility: hidden !important;
      }
      #kos-mp-banner {
        user-select: none !important;
        -webkit-user-select: none !important;
        -webkit-touch-callout: none !important;
      }
    </style>
  </head>

  <body>
    <p id="fps"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
